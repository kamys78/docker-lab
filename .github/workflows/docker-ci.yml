name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with cache
        uses: docker/build-push-action@v5
        with:
          context: ./app
          tags: flask-app:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start app + db with Compose
        run: docker compose up -d --build

      - name: Wait for app to be healthy
        run: |
          for i in {1..10}; do
            if curl -sf http://localhost:5001/db-check; then
              echo "App is healthy"
              exit 0
            fi
            echo "Waiting for app... attempt $i"
            sleep 3
          done
          echo "App never became healthy"
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  python-version-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run basic import check
        run: python -c "import flask; import psycopg2; print('Imports OK on Python ${{ matrix.python-version }}')"